#===================================================================
# NOCTALIA (notebook) — config declarativa del flake.
#===================================================================
# Igual que config.toml del desktop, adaptado al ThinkPad: reloj 24 h, barra
# más fina con launcher y batería, sin ddcutil ni auto_locate, sin negro puro.
#
# `noctalia-sync` espeja acá los ajustes de la GUI: el target por host sale de
# programs.noctalia.settings (ver home-manager/modules/noctalia.nix).
#
# Idle: ÚNICO gestor es swayidle (modules/niri.nix), igual que en desktop. No
# agregar [idle.behavior.*] acá.
#===================================================================

[accessibility]
ui_scale = 1.0
high_contrast = false

[shell]
corner_radius_scale = 0
font_family = "JetBrainsMono Nerd Font"
time_format = "{:%H:%M}"
date_format = "%A, %x"
clipboard_enabled = true
clipboard_history_max_entries = 100
polkit_agent = true
shared_gl_context = true
avatar_path = "/home/necro/Pictures/Wallpapers/wallpaper13.jpg"
screen_time_enabled = true
niri_overview_type_to_launch_enabled = true

[shell.panel]
transparency_mode = "glass"
borders = true
shadow = true
control_center_placement = "attached"

[shell.animation]
enabled = true
speed = 1.0

[shell.shadow]
direction = "down"
alpha = 0.55

[shell.launcher]
categories = false
compact = true
    layout = "simple"
app_grid = false

[[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
enabled = true
    shortcut = "1"
    variant = "default"

[[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
enabled = true
    shortcut = "2"
    variant = "default"

[[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
enabled = true
    shortcut = "3"
    variant = "default"

[[shell.session.actions]]
    action = "command"
    command = "noctalia msg session lock && sleep 1 && systemctl hibernate"
    countdown_seconds = 0.0
enabled = true
    glyph = "hibernate"
    label = "hibernate"
    shortcut = "6"
    variant = "default"

[[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
enabled = true
    shortcut = "4"
    variant = "default"

[[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
enabled = true
    shortcut = "5"
    variant = "destructive"
[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"
pure_black_dark = true
builtin = "Kanagawa"

[theme.templates]
enable_builtin_templates = true
builtin_ids = ["gtk3", "gtk4", "niri", "kitty", "qt", "starship"]
enable_community_templates = true
community_ids = ["opencode", "neovim", "obsidian", "vscode", "zathura", "papirus-icons"]

[wallpaper]
enabled = true
fill_mode = "crop"
transition = ["fade"]
transition_duration = 1500
edge_smoothness = 0.3
transition_on_startup = false
directory = "~/Pictures/Wallpapers"

[wallpaper.automation]
enabled = true
interval_seconds = 1800
order = "random"
recursive = true

[[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "/home/necro/Pictures/Wallpapers/wallpaper.jpg"
    theme_mode = "dark"
    wallpaper_scheme = "m3-content"

[[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "/home/necro/Pictures/Wallpapers/wallpaper12.jpg"
    theme_mode = "dark"
    wallpaper_scheme = "m3-content"

[[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "/home/necro/Pictures/Wallpapers/wallpaper14.jpg"
    theme_mode = "dark"
    wallpaper_scheme = "vibrant"

[[wallpaper.favorite]]
    path = "/home/necro/Pictures/Wallpapers/wallpaper16.jpg"
[bar.main]
position = "top"
thickness = 28
background_opacity = 0.6
radius = 0
margin_ends = 25
margin_edge = 2
padding = 14
widget_spacing = 6
scale = 1.0
shadow = true
auto_hide = false
reserve_space = true
capsule = false

start = ["launcher", "spacer_2", "workspaces", "spacer_2", "tray"]
center = ["clock"]
end = ["battery", "volume", "group:g1", "control-center", "session"]
margin_opposite_edge = 6
panel_overlap = 2

[[bar.main.capsule_group]]
enabled = true
    fill = "surface_variant"
    id = "g1"
members = ["notifications", "wallpaper"]
    opacity = 1.0
    padding = 6.0
[notification]
enable_daemon = true
show_app_name = true
show_actions = true
layer = "top"
scale = 1.0
background_opacity = 0.7
offset_x = 20
offset_y = 8

[osd]
position = "top_right"
orientation = "horizontal"
scale = 1.0
background_opacity = 0.7
offset_x = 20
offset_y = 8

[osd.kinds]
volume = true
brightness = true
dnd = true
lock_keys = true

[lockscreen]
enabled = true
blurred_desktop = true
blur_intensity = 0.5
tint_intensity = 0.3

[backdrop]
enabled = true
blur_intensity = 0.4
tint_intensity = 0.2

[system.monitor]
enabled = true
cpu_poll_seconds = 2.0
gpu_poll_seconds = 5.0
memory_poll_seconds = 2.0
network_poll_seconds = 3.0

[weather]
enabled = true

[audio]
enable_overdrive = false
enable_sounds = false

[brightness]
enable_ddcutil = false

[nightlight]
enabled = true
temperature_day = 6500
temperature_night = 3500

[location]
auto_locate = true
custom_schedule = true
sunrise = "07:00"
sunset = "22:00"

[battery]
warning_threshold = 10

[theme.templates.user.nvim-base16]
# output_path ABSOLUTO obligatorio: Noctalia no expande $HOME ni
# $XDG_CONFIG_HOME en este campo. Con "$HOME/..." el archivo caía en
# ~/.config/noctalia/$HOME/.config/nvim/lua/noctalia.lua y el colorscheme del
# notebook nunca se actualizaba (bug corregido 2026-09-21; el desktop ya usaba
# ruta absoluta y por eso funcionaba).
input_path = "templates/nvim-base16.lua"
output_path = "/home/necro/.config/nvim/lua/noctalia.lua"
post_hook = "pkill -SIGUSR1 nvim"

[hooks]
wallpaper_changed = "noctalia msg templates-apply; sleep 2; kill -SIGUSR1 $(pidof kitty 2>/dev/null); pkill -SIGUSR1 nvim; niri msg action load-config-file" # sleep 2: apply.sh de kitty cuelga (dns a github), esperamos a que Tanda 1 (~1s) termine antes de recargar
session_unlocked = "noctalia msg bluetooth-disable"
started = "noctalia msg bluetooth-disable"

[calendar]
enabled = true

[calendar.account.personal_google]
    color = "primary"
    name = "Calendario"
    type = "google"

[idle]
behavior_order = ["lock", "screen-off", "lock-and-suspend"]

[idle.behavior.lock]
    action = "lock"
enabled = false
    timeout = 600.0

[idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
enabled = true
    timeout = 900.0

[idle.behavior.screen-off]
    action = "screen_off"
enabled = false
    timeout = 660.0

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = ["lockscreen-login-box@HDMI-A-2", "lockscreen-login-box@eDP-1"]

[lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2"]
    box_height = 196.0
    box_width = 720.0
    cx = 960.0
    cy = 768.0
    output = "HDMI-A-2"
    placement_height = 768.0
    placement_width = 1360.0
    rotation = 0.0
    type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = true
show_session_buttons = true
show_unlock_hint = true
show_weather = true

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 720.0
    cx = 683.0
    cy = 384.0
    output = "eDP-1"
    placement_height = 768.0
    placement_width = 1366.0
    rotation = 0.0
    type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = true
show_session_buttons = true
show_unlock_hint = true
show_weather = true

[plugins]
enabled = ["ashur-d/nvim-projects"]

[widget.spacer_2]
type = "spacer"

[control_center.calendar]
show_events_card = false

[dock]
icon_size = 20

#===================================================================
# NOCTALIA (desktop) — config declarativa del flake.
#===================================================================
# `noctalia-sync` (home-manager/modules/noctalia.nix) copia acá, cada vez que
# la GUI escribe ~/.local/state/noctalia/settings.toml, los ajustes que toques
# en Ajustes. Preserva comentarios y orden de las claves existentes y solo
# agrega/actualiza: nunca borra. Se excluyen las tablas de ESTADO
# (wallpaper.last / wallpaper.monitors) para no ensuciar el repo en cada
# rotación de wallpaper.
#
# Flujo inverso: NO es automático. Mientras una clave siga en settings.toml,
# ese overlay gana sobre este archivo. Si editaste algo acá a mano y no se
# aplica, sacá la clave del overlay (o cambiala desde la GUI) y corré
# `noctalia-sync`.
#
# Idle: ÚNICO gestor es swayidle (modules/niri.nix: lock 600 s, DPMS off
# 660 s, suspensión 1200 s). No agregar [idle.behavior.*] acá: sería un
# segundo gestor de idle en paralelo (bug detectado 2026-09-21).
#===================================================================

[accessibility]
ui_scale = 1.0
high_contrast = false

[shell]
corner_radius_scale = 0
font_family = "JetBrainsMono Nerd Font"
time_format = "{:%I:%M %p}"
date_format = "%A, %x"
clipboard_enabled = true
clipboard_history_max_entries = 100
polkit_agent = true
shared_gl_context = true
niri_overview_type_to_launch_enabled = true
avatar_path = "/home/necro/Pictures/Wallpapers/wallpaper14.jpg"
clipboard_confirm_clear_history = false
lang = "es"
screen_time_enabled = true

[shell.panel]
transparency_mode = "glass"
borders = true
shadow = true
control_center_placement = "attached"

[shell.animation]
enabled = true
speed = 1.0

[shell.launcher]
categories = false
compact = true

[shell.shadow]
direction = "down"
alpha = 0.55

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "faithful"
pure_black_dark = true

# Plantillas: builtin (gtk/niri/kitty/qt/starship) + community. `community_ids`
# lo reescribe noctalia-sync con lo que tengas habilitado en Ajustes >
# Plantillas. Dos plantillas necesitan una mano del lado de la app:
#   sioyek  -> escribe ~/.config/sioyek/themes/noctalia.config; el `source`
#              que lo carga está en config/sioyek/prefs_user.config (read-only:
#              la plantilla no puede agregarlo sola).
#   zathura -> escribe ~/.config/zathura/noctaliarc; zathurarc lo incluye al
#              final del archivo y su apply.sh recarga instancias por D-Bus.
builtin = "Ayu"
community_palette = "ADW"
custom_palette = "magick-wallpaper"
shell_mode = "dark"

[theme.templates]
enable_builtin_templates = true
builtin_ids = ["gtk3", "gtk4", "niri", "kitty", "qt", "starship"]
enable_community_templates = true
community_ids = ["opencode", "discord", "neovim", "obsidian", "vscode", "sioyek", "zathura", "papirus-icons"]

[wallpaper]
enabled = true
fill_mode = "crop"
transition = ["zoom"]
transition_duration = 1500
edge_smoothness = 0.3
transition_on_startup = false
directory = "~/Pictures/Wallpapers"

[wallpaper.automation]
enabled = true
interval_seconds = 3600
order = "random"
recursive = true

[wallpaper.default]
    path = "/home/necro/Pictures/Wallpapers/wallpaper2.jpg"

[[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "/home/necro/Pictures/Wallpapers/wallpaper7.jpg"
    theme_mode = "dark"
    wallpaper_scheme = "vibrant"

[[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "/home/necro/Pictures/Wallpapers/wallpaper15.jpg"
    theme_mode = "dark"
    wallpaper_scheme = "vibrant"

[[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "/home/necro/Pictures/Wallpapers/wallpaper14.jpg"
    theme_mode = "dark"
    wallpaper_scheme = "muted"

[[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "/home/necro/Pictures/Wallpapers/wallpaper11.jpg"
    theme_mode = "dark"
    wallpaper_scheme = "faithful"
